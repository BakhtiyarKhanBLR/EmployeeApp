<h2>Employee Details</h2>

<table>
  <thead>
    <tr>
      <th>Employee ID</th>
      <th>Name</th>
      <th>Department</th>
      <th>Salary</th>
    </tr>
  </thead>

  <tbody>

    @for (employee of employees; track employee.id) {
    <tr>
      <td>{{ employee.id }}</td>
      <td>{{ employee.name }}</td>
      <td>{{ employee.department }}</td>
      <td>₹{{ employee.salary }}</td>
    </tr>
    }

  </tbody>
</table>
